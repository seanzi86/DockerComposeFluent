version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/DockerComposeFluent"
      - "/test/DockerComposeFluent.Tests.Unit"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
