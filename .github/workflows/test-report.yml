name: Test Report

# Separate from CI on purpose: a PR from a fork runs CI with a read-only token, which can't create a check
# run. This workflow runs in the context of main instead, with write permission, and only reads the test
# results CI already uploaded as an artifact - it never checks out or executes the PR's own code.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: test-results
          name: Test results
          path: "*.trx"
          reporter: dotnet-trx
