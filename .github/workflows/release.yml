name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release # must match the Environment set on the nuget.org Trusted Publishing policy
    permissions:
      id-token: write # required to request the GitHub OIDC token for NuGet Trusted Publishing
      contents: write # required to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Validates the public API against the latest release already on nuget.org (this version is not pushed yet).
      - name: Pack
        run: |
          baseline=$(curl -fsS https://api.nuget.org/v3-flatcontainer/dockercomposefluent/index.json | jq -r '[.versions[] | select(contains("-") | not)] | last // empty' || true)
          baseline_args=""
          if [ -n "$baseline" ]; then
            echo "Validating the public API against $baseline"
            baseline_args="-p:PackageValidationBaselineVersion=$baseline"
          else
            echo "::warning::Could not find the latest release on nuget.org, so the public API was not compared with it."
          fi
          dotnet pack src/DockerComposeFluent/DockerComposeFluent.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} $baseline_args --output ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the .snupkg symbols package next to it.
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          # A release may already exist if it was published from the GitHub UI, which creates the tag.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
          fi
