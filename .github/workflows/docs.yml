name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "src/DockerComposeFluent/**"
      - "scripts/generate-api-reference.sh"
      - "scripts/generate-supported-properties.sh"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/DockerComposeFluent/**"
      - "scripts/generate-api-reference.sh"
      - "scripts/generate-supported-properties.sh"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write # only actually used on push, to look up the Pages configuration

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      # Regenerates website/docs/api-reference from the library's XML doc comments; that folder is
      # git-ignored (see website/.gitignore) since it's fully generated.
      - name: Generate API reference
        run: bash scripts/generate-api-reference.sh

      # Unlike the API reference, supported-properties.md IS committed, so a stale copy (a doc comment
      # changed without re-running the generator) fails the build here instead of silently drifting.
      - name: Generate supported properties
        run: |
          bash scripts/generate-supported-properties.sh
          git diff --exit-code -- website/docs/supported-properties.md || {
            echo "::error::website/docs/supported-properties.md is out of date. Run 'npm run docs:supported' in website/ and commit the result."
            exit 1
          }

      # onBrokenLinks and onBrokenMarkdownLinks are both set to "throw" in docusaurus.config.ts,
      # so a broken internal link fails this step, on a pull request as much as on main.
      - name: Build
        run: npm run build
        working-directory: website

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build for deploy
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    # Only deploy from main; a pull request only needs the build above to prove the site still builds.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # Scoped to this job, not the whole workflow: an unrelated pull request's build must never cancel a
    # deploy in progress. A second push to main queues behind the first rather than racing it.
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
