name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory for a dependency fails the build even when no PR is open.
    - cron: "0 6 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Checks the package can be built and passes package validation (the target frameworks are consistent).
      - name: Pack
        run: dotnet pack src/DockerComposeFluent/DockerComposeFluent.csproj --no-build --configuration Release

      # Pinned so the version the fixtures are validated against is recorded and reproducible.
      # Dependabot does not update this input, so bump it by hand when a newer Compose is released.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1

      - name: Validate golden fixtures with Docker Compose
        run: |
          docker compose version
          for fixture in test/DockerComposeFluent.Tests.Unit/Golden/Fixtures/*.verified.yml; do
            echo "Validating $fixture"
            docker compose -f "$fixture" config --quiet
          done
