services:
  "app":
    image: "example/app"
    annotations:
      "com.example.team": "platform"
      "com.example.tier": "backend"
    post_start:
      - command: "./migrate.sh"
      - command: ["sh", "-c", "echo started"]
        environment:
          "MODE": "warm"
        privileged: true
        user: "root"
        working_dir: "/app"
        x-note: runs once
    pre_stop:
      - command: "./drain.sh"
      - command: ["sh", "-c", "sleep 5"]
