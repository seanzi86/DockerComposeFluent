name: "webapp"
services:
  "proxy":
    container_name: "webapp-proxy"
    image: "nginx:1.27"
    networks:
      "public": {}
      "private":
        aliases:
          - "proxy.internal"
    ports:
      - published: "80"
        target: 80
      - host_ip: "0.0.0.0"
        name: "https"
        published: "443"
        target: 443
    volumes:
      - "./proxy/nginx.conf:/etc/nginx/nginx.conf:ro"
  "api":
    command: ["dotnet", "Api.dll", "--urls", "http://+:8080"]
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ConnectionStrings__Db": "Host=db;Database=app;Username=app"
      "Cache__Enabled": "true"
      "Cache__TimeoutSeconds": "30"
      "Db__Password": null
    image: "ghcr.io/example/api:2.4.1"
    networks:
      - "private"
    volumes:
      - target: "/tmp"
        type: "tmpfs"
  "db":
    environment:
      - "POSTGRES_DB=app"
      - "POSTGRES_USER=app"
      - "POSTGRES_PASSWORD"
    image: "postgres:17"
    networks:
      "private":
        aliases:
          - "database"
    volumes:
      - "db-data:/var/lib/postgresql/data"
  "cache":
    command: "redis-server --save 60 1 --loglevel warning"
    image: "redis:7"
    networks:
      - "private"
    volumes:
      - "cache-data:/data"
networks:
  "public":
    driver: "bridge"
  "private":
    internal: true
volumes:
  "db-data":
    driver: "local"
  "cache-data":
    name: "webapp_cache"
