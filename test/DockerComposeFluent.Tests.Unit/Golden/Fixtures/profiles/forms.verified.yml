services:
  "frontend":
    image: "frontend"
    profiles:
      - "frontend"
  "phpmyadmin":
    depends_on:
      - "db"
    image: "phpmyadmin"
    profiles:
      - "debug"
  "multiple":
    image: "nginx"
    profiles:
      - "frontend"
      - "debug"
  "db":
    image: "postgres"
  "always":
    image: "nginx"
