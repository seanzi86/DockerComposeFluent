services:
  "frontend":
    image: "example/webapp"
    secrets:
      - "server-certificate"
  "api":
    image: "example/api"
    secrets:
      - "token"
      - source: "server-certificate"
        target: "server.cert"
  "admin":
    image: "example/admin"
    secrets:
      - gid: "103"
        mode: 288
        source: "server-certificate"
        target: "server.cert"
        uid: "103"
secrets:
  "server-certificate":
    file: "./server.cert"
  "token":
    environment: "OAUTH_TOKEN"
  "external-cert":
    external: true
    name: "shared-cert"
