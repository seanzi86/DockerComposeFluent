services:
  "web":
    image: "nginx"
    ports:
      - "80"
      - "8080:80"
      - "127.0.0.1:9000:90/udp"
      - protocol: "udp"
        published: "8081"
        target: 81
      - app_protocol: "http"
        host_ip: "127.0.0.1"
        mode: "host"
        name: "web"
        published: "8000-9000"
        target: 82
  "worker":
    image: "busybox"
